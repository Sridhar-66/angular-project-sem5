<div class="toast-container">
  @for (toast of activeToasts(); track toast.id) {
    <div
      class="toast"
      [class.toast-brand]="toast.type === 'order_placed'"
      [class.toast-info]="toast.type !== 'order_placed'"
    >
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
        <span style="font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-brand);">
          {{ toast.type === 'order_placed' ? '🛍️ New Order' : '📦 Status Update' }}
        </span>
        <span style="font-size: 0.9rem; color: var(--color-text); line-height: 1.4;">
          {{ toast.message }}
        </span>
      </div>
      <button
        (click)="dismiss(toast.id)"
        class="toast-close"
        aria-label="Dismiss"
      >✕</button>
    </div>
  }
</div>
