<div class="bell-container" style="position: relative; display: inline-block;">
  <button
    class="bell-btn"
    (click)="toggleDropdown()"
    title="Notifications"
    style="width:40px; height:40px; font-size:1.2rem;"
  >
    🔔
    @if (notifSvc.unreadCount() > 0) {
      <span class="bell-badge">{{ notifSvc.unreadCount() }}</span>
    }
  </button>

  @if (dropdownOpen) {
    <div class="notification-dropdown">
      <div class="notification-header">
        <span>Notifications</span>
        @if (notifSvc.unreadCount() > 0) {
          <button
            style="background: none; border: none; color: var(--color-brand); font-size: 0.75rem; cursor: pointer; font-weight: 700; transition: opacity 0.2s;"
            (click)="markAllRead()"
          >Mark all read</button>
        }
      </div>

      <div class="notification-list">
        @if (notifSvc.notifications().length === 0) {
          <div class="notification-empty">
            <div style="font-size:2rem; opacity:0.5; margin-bottom:8px;">🔔</div>
            No notifications yet
          </div>
        }

        @for (notif of notifSvc.notifications(); track notif.id) {
          <div
            class="notification-item"
            [class.unread]="!notif.is_read"
            (click)="markAsRead(notif.id)"
          >
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
              <span
                class="notif-msg"
                [style.font-weight]="!notif.is_read ? '700' : '400'"
              >{{ notif.message }}</span>
              @if (!notif.is_read) {
                <div style="width:8px; height:8px; border-radius:50%; background:var(--color-brand); flex-shrink:0; margin-top:4px; box-shadow: 0 0 6px var(--color-brand-glow);"></div>
              }
            </div>
            <span class="notif-time">{{ notif.created_at | date:'dd MMM, HH:mm' }}</span>
          </div>
        }
      </div>
    </div>
  }
</div>
