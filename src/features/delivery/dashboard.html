<nav class="navbar navbar-delivery">
  <span class="navbar-brand">
    <span style="font-size:1.1rem;">🏛️</span> Thesaurus
  </span>
  <span class="navbar-spacer"></span>
  <div class="navbar-actions">
    <span class="badge badge-delivery">🚚 Delivery</span>
    <span style="color:var(--color-text-muted); font-size:0.85rem; font-weight:600;">{{ auth.profile()?.full_name }}</span>
    <app-notification-bell></app-notification-bell>
    <button id="delivery-logout" class="btn btn-secondary btn-sm" (click)="logout()">Sign Out</button>
  </div>
</nav>

<!-- Tab Navigation (emerald accent) -->
<div class="customer-tab-nav delivery-tabs">
  <a routerLink="/delivery/orders" routerLinkActive="active" class="tab-link">
    🚚 My Orders
    <span class="tab-badge" style="background:var(--color-delivery-accent);" *ngIf="orderSvc.myOrders().length > 0">{{ orderSvc.myOrders().length }}</span>
  </a>
  <a routerLink="/delivery/analytics" routerLinkActive="active" class="tab-link">
    📊 Earnings
  </a>
  <a routerLink="/delivery/account" routerLinkActive="active" class="tab-link">
    👤 Account
  </a>
</div>

<main class="customer-content">
  <router-outlet></router-outlet>
</main>

<app-toast></app-toast>
